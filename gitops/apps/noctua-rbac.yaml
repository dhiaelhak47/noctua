apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: noctua-rbac
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/dhiaelhak47/noctua.git
    targetRevision: HEAD
    path: noctua/rbac
  destination:
    server: https://kubernetes.default.svc
    namespace: noctua
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
