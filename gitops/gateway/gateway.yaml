apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: noctua-gateway
  namespace: envoy-gateway-system
spec:
  gatewayClassName: noctua
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway.networking.k8s.io/allow-noctua: "true"
