fullnameOverride: ledger-api

replicaCount: 2

image:
  repository: ghcr.io/stefanprodan/podinfo
  tag: "6.7.0"

service:
  port: 9898
  targetPort: 9898

# S01 scenario: remove DB_POOL_SIZE to trigger CrashLoopBackOff (Phase 6+)
env:
  PODINFO_UI_MESSAGE: "ledger-api"
  DB_POOL_SIZE: "10"

httpRoute:
  enabled: true
  hostnames:
    - ledger-api.noctua.local
  gateway:
    name: noctua-gateway
    namespace: envoy-gateway-system

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
