name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq shellcheck
          git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats-core
          sudo /tmp/bats-core/install.sh /usr/local

      - name: Make scripts executable
        run: |
          chmod +x noctua/noctua noctua/investigate.sh noctua/seal.sh \
                   noctua/report.sh noctua/redact.sh \
                   noctua/collectors/*.sh noctua/analyst/rules.sh

      - name: Lint
        run: |
          shellcheck noctua/noctua noctua/investigate.sh noctua/seal.sh \
                     noctua/report.sh noctua/redact.sh \
                     noctua/collectors/*.sh noctua/analyst/rules.sh

      - name: Test
        run: bats noctua/tests/

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Lint noctua-service chart (all value overrides)
        run: |
          helm lint charts/noctua-service -f gitops/estate/atlas-gateway/values.yaml
          helm lint charts/noctua-service -f gitops/estate/ledger-api/values.yaml
          helm lint charts/noctua-service -f gitops/estate/inventory-svc/values.yaml

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy on chart templates
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: charts/
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"   # non-blocking until baseline established

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Scan Kyverno policies with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: security/
          format: table
          exit-code: "0"
