name: Terraform

on:
  workflow_dispatch:
    inputs:
      action:
        description: "terraform plan | apply | destroy"
        required: true
        default: plan
        type: choice
        options: [plan, apply, destroy]
  push:
    branches: [main]
    paths:
      - infra/terraform/**

permissions:
  id-token: write   # required for OIDC token exchange
  contents: read

env:
  TF_DIR: infra/terraform
  ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  # No ARM_CLIENT_SECRET — OIDC only.

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action || 'plan' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform plan
        working-directory: ${{ env.TF_DIR }}
        run: terraform plan -out=tfplan

      - name: Terraform apply
        if: ${{ github.event.inputs.action == 'apply' }}
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve tfplan

      - name: Terraform destroy
        if: ${{ github.event.inputs.action == 'destroy' }}
        working-directory: ${{ env.TF_DIR }}
        run: terraform destroy -auto-approve

      - name: Get kubeconfig
        if: ${{ github.event.inputs.action == 'apply' }}
        run: |
          az aks get-credentials \
            --resource-group noctua-demo \
            --name noctua-aks \
            --overwrite-existing
          echo "Cluster ready. Run: az aks get-credentials --resource-group noctua-demo --name noctua-aks"
