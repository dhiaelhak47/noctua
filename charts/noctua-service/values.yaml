# Safe defaults — override per service in gitops/estate/<service>/values.yaml

replicaCount: 2

image:
  repository: ghcr.io/stefanprodan/podinfo
  tag: "6.7.0"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  port: 9898      # podinfo default; override for custom images
  targetPort: 9898

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

networkPolicy:
  enabled: true

serviceMonitor:
  enabled: true
  interval: 30s
  path: /metrics

env: {}
#  DB_POOL_SIZE: "10"
#  FAULT_MODE: ""

# HTTPRoute for Envoy Gateway (Phase 1+)
httpRoute:
  enabled: false
  hostnames: []
  # - ledger-api.noctua.local
  gateway:
    name: noctua-gateway
    namespace: envoy-gateway-system

slo:
  enabled: true
  availabilityTarget: "99.5"   # %
  latencyTarget: "300"          # ms p95
