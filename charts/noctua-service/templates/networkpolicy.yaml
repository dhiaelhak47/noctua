{{- if .Values.networkPolicy.enabled }}
# Default-deny all ingress, then allow only from Envoy Gateway and Prometheus.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "noctua-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "noctua-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "noctua-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from Envoy Gateway
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
    # Allow Prometheus scrape
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
  egress:
    # Allow DNS
    - ports:
        - protocol: UDP
          port: 53
    # Allow outbound to cluster services (for inter-service calls)
    - to:
        - namespaceSelector: {}
{{- end }}
